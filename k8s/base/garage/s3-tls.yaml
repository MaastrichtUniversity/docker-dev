# nginx TLS front for the garage S3 API (was garage1-s3-tls/garage2-s3-tls).
# iRODS S3 plugin connects to garage1/2-s3-tls.irods.svc.cluster.local:9000
# (k8s/dh-local-worklist.md); the cert SANs match those names.
# The nginx ssl_certificate file names keep the old .dh.local names (names are arbitrary, SANs matter).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage1-s3-tls
  namespace: irods
  labels:
    app.kubernetes.io/name: garage1-s3-tls
    app.kubernetes.io/part-of: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage1-s3-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage1-s3-tls
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Overlay rewrites this to the mirrored registry image
          image: nginx:alpine
          ports:
            - name: s3-tls
              containerPort: 9000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: s3-tls
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: s3-tls
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-garage1.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: nginx-garage1-conf
        - name: tls
          secret:
            secretName: garage1-tls
            defaultMode: 0644
---
