apiVersion: v1
kind: Service
metadata:
  name: garage1
  labels:
    app.kubernetes.io/name: garage1
    app.kubernetes.io/part-of: datahub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage1
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
      protocol: TCP
    - name: rpc
      port: 3901
      targetPort: 3901
      protocol: TCP
    - name: admin
      port: 3903
      targetPort: 3903
      protocol: TCP
---
