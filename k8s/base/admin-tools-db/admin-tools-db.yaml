apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: admin-tools-db
  namespace: internal
  labels:
    app.kubernetes.io/name: admin-tools-db
    app.kubernetes.io/part-of: datahub
    datahub.dh/profile: full
spec:
  serviceName: admin-tools-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-tools-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-tools-db
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Overlay rewrites this to the mirrored registry image
          image: postgres:17.10-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Europe/Amsterdam
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-tools-secrets
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: admin-tools-db-env
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-rwo
        resources:
          requests:
            storage: 1Gi
---
# Headless Service (StatefulSet stable DNS).
# Clients use admin-tools-db.internal.svc.cluster.local (k8s/dh-local-worklist.md).
# (compose exposed 5432 on the host for dev convenience; use kubectl port-forward instead)
apiVersion: v1
kind: Service
metadata:
  name: admin-tools-db
  namespace: internal
  labels:
    app.kubernetes.io/name: admin-tools-db
    app.kubernetes.io/part-of: datahub
    datahub.dh/profile: full
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: admin-tools-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
