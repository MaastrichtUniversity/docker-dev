# iRODS iCAT (catalog provider).
#
# Important k8s specifics (see k8s/README.md):
#  - spec.hostname is a DNS label (Kubernetes PodSpec requirement); the
#    HOSTNAME env retains the service FQDN (icat.irods.svc.cluster.local).
#    StatefulSet/headless-Service DNS provides the network name. The SSL
#    cert SAN must match the service FQDN
#    (k8s/dh-local-worklist.md A).
#  - Headless Service: clients reach the pod IP directly, so the iRODS data port
#    range 20000-20199 works (a ClusterIP Service cannot expose 200 ports).
#  - /var/run/irods_installed (iRODS "bootstrap completed" flag) is persisted on the
#    vault PVC via subPath so recreated pods skip re-bootstrap when possible.
#  - runAsNonRoot: false and CAP_NET_BIND_SERVICE are deliberate deviations
#    (iRODS installs as root, rsyslogd binds :514). Namespace is PSS baseline.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: icat
  namespace: irods
  labels:
    app.kubernetes.io/name: icat
    app.kubernetes.io/part-of: datahub
    app.kubernetes.io/component: irods
spec:
  serviceName: icat
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icat
        app.kubernetes.io/part-of: datahub
        app.kubernetes.io/component: irods
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      hostname: icat
      # compose had shm_size: 500mb (Docker default /dev/shm is 64Mi)
      subdomain: icat
      securityContext:
        runAsNonRoot: false
        fsGroup: 999
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: RuntimeDefault
        # net.* sysctls are in the k8s default-allowed sysctl list
        sysctls:
          - name: net.ipv4.tcp_keepalive_intvl
            value: "75"
          - name: net.ipv4.tcp_keepalive_probes
            value: "9"
          - name: net.ipv4.tcp_keepalive_time
            value: "600"
      initContainers:
        # iRODS leaks its named shared-memory segments in /dev/shm whenever
        # irodsServer is killed (e.g. by a failing liveness probe) instead of
        # shutting down gracefully. Over repeated in-pod restarts the stale
        # segments fill the 512Mi dshm emptyDir and the next irodsServer start
        # aborts with "boost::interprocess::interprocess_exception: No space
        # left on device". Wipe them before every container start.
        - name: clean-shm
          # same image as the main container (kustomize rewrites both)
          image: registry.prod.dh.unimaas.nl/docker-dev/icat:latest
          command:
            - bash
            - -c
            - |
              rm -f /dev/shm/irods_* /dev/shm/sem.irods_stdout_ipc_sink
              echo "INFO: cleaned stale iRODS segments from /dev/shm"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
        # Make sure irods-db is accepting connections before the pre-hook psql checks
        - name: wait-db
          # same image as the main container (kustomize rewrites both)
          image: registry.prod.dh.unimaas.nl/docker-dev/icat:latest
          command:
            - bash
            - -c
            - |
              until PGPASSWORD="${ENV_IRODS_DB_POSTGRES_PASSWORD}" psql -h "${ENV_IRODS_DB_HOSTNAME}" -U postgres -c '\l' >/dev/null 2>&1; do
                echo "INFO: waiting for irods-db at ${ENV_IRODS_DB_HOSTNAME}"; sleep 5
              done
              num_tables=$(PGPASSWORD="${ENV_IRODS_DB_IRODS_PASSWORD}" psql -h "${ENV_IRODS_DB_HOSTNAME}" -U "${ENV_IRODS_DB_USERNAME}" -d "${ENV_IRODS_DB_NAME}" -XAtc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" 2>/dev/null || echo 0)
              if [ ! -e /vault-pvc/.irods_installed ] || [ ! -e /vault-pvc/.etc-irods/server_config.json ] || [ "${num_tables:-0}" -le 20 ]; then
                echo "INFO: initializing /var/lib/irods and /etc/irods on vault PVC (num_tables=${num_tables:-0})..."
                rm -rf /vault-pvc/.irods_installed /vault-pvc/version.json /vault-pvc/.etc-irods /vault-pvc/.irods
                mkdir -p /vault-pvc/.etc-irods
                cp -a /etc/irods/. /vault-pvc/.etc-irods/
                cp -a /var/lib/irods/. /vault-pvc/
                cp -a /var/lib/irods/scripts/setup_irods.py /vault-pvc/scripts/setup_irods.py.orig
                chown -R 999:999 /vault-pvc
              fi
          env:
            - name: ENV_IRODS_DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_DB_POSTGRES_PASSWORD
            - name: ENV_IRODS_DB_IRODS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_DB_IRODS_PASSWORD
            - name: ENV_EPICPID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epicpid-app-secrets
                  key: PASSWORD
            - name: ENV_ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: ELASTIC_PASSWORD
          envFrom:
            - configMapRef:
                name: irods-common-env
            - configMapRef:
                name: icat-env
            - secretRef:
                name: dh-irods-secrets-cfg
          volumeMounts:
            - name: vault
              mountPath: /vault-pvc
        # Docker Compose bind-mounts externals/irods-ruleset at /rules.
        # On k3s, unpack the vendored source snapshot into a pod-local volume.
        - name: install-ruleset
          image: registry.prod.dh.unimaas.nl/docker-dev/icat:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              base64 -d /ruleset-source/ruleset.tar.gz.b64 | tar -xz -C /rules
              chown -R 999:999 /rules
          volumeMounts:
            - name: irods-ruleset-source
              mountPath: /ruleset-source
              readOnly: true
            - name: rules
              mountPath: /rules
      containers:
        - name: icat
          # Overlay rewrites this to <registry>/docker-dev/icat:<tag>
          image: registry.prod.dh.unimaas.nl/docker-dev/icat:latest
          command:
            - /bin/bash
            - -c
            - |
              rm -rf /var/lib/irods/irods_installed /var/run/irods_installed /etc/irods
              ln -s /var/lib/irods/.irods_installed /var/run/irods_installed
              ln -s /var/lib/irods/.etc-irods /etc/irods
              mkdir -p /mnt/SURF-Archive
              chown 999:999 /mnt/SURF-Archive
              mkdir -p /run/irods
              chown 999:999 /run/irods
              if ! odbcinst -q -d | grep -Fxq '[PostgreSQL]'; then
                odbcinst -i -d -r < /opt/irods/config/odbc-settings.txt
              fi
              awk -v h="${HOSTNAME}" '{for(i=2;i<=NF;i++) if($i==h) f=1} END{exit !f}' /etc/hosts || {
                sed "s/$(hostname)/${HOSTNAME} $(hostname)/" /etc/hosts > /tmp/hosts
                cp /tmp/hosts /etc/hosts
                rm -f /tmp/hosts
              }
              if [ ! -e /var/lib/irods/.irods_installed ] && [ -e /var/lib/irods/scripts/setup_irods.py.orig ]; then
                rm -f /var/lib/irods/version.json
                cp -a /var/lib/irods/scripts/setup_irods.py.orig /var/lib/irods/scripts/setup_irods.py
              fi
              /opt/irods/init.sh || {
                echo "iCAT startup failed; tailing iRODS logs" >&2
                for log in /var/log/irods/irods.log /var/log/syslog; do
                  if [[ -r "$log" ]]; then tail -n 100 "$log" >&2; fi
                done
                exit 1
              }
          env:
            - name: HOSTNAME
              value: icat.irods.svc.cluster.local
            - name: TZ
              value: Europe/Amsterdam
            - name: ENV_IRODS_PASSWORD_ADMIN
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASSWORD_ADMIN
            - name: IRODS_PASS
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASS
            - name: ENV_IRODS_KEY_SERVER_ZONE
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_SERVER_ZONE
            - name: ENV_IRODS_KEY_SERVER_NEGOTIATION
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_SERVER_NEGOTIATION
            - name: ENV_IRODS_KEY_CONTROL_PLANE
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_CONTROL_PLANE
            - name: ENV_IRODS_PASSWORDS_SALT
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASSWORDS_SALT
            - name: ENV_IRODS_DB_IRODS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_DB_IRODS_PASSWORD
            - name: ENV_IRODS_DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_DB_POSTGRES_PASSWORD
            - name: ENV_EPICPID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epicpid-app-secrets
                  key: PASSWORD
            - name: ENV_ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: ELASTIC_PASSWORD
          envFrom:
            - configMapRef:
                name: irods-common-env
            - configMapRef:
                name: icat-env
            - secretRef:
                name: dh-irods-secrets-cfg
          ports:
            - name: irods
              containerPort: 1247
              protocol: TCP
            - name: irods-ctrl
              containerPort: 1248
              protocol: TCP
            # iRODS data port range (documentary; the pod listens on 20000-20199)
            - name: irods-data
              containerPort: 20000
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Full bootstrap (setup_irods.py + ruleset make + dev mock env) can take
          # 10-30 minutes on a fresh stack; only then does /dh_is_ready.sh pass.
          startupProbe:
            exec:
              command: ["/dh_is_ready.sh"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/dh_is_ready.sh"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          # Liveness must not depend on other pods (mock env check in /dh_is_ready.sh
          # would crashloop icat if e.g. its own irodsServer blips during a DB restart)
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "su irods -c 'ils >/dev/null'"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: vault
              mountPath: /var/lib/irods
            - name: rules
              mountPath: /rules
            # Overrides that docker-compose bind-mounted
            - name: icat-bootstrap
              mountPath: /opt/irods/bootstrap.sh
              subPath: bootstrap.sh
            - name: icat-bootstrap
              mountPath: /dh_is_ready.sh
              subPath: dh_is_ready.sh
            - name: icat-hooks
              mountPath: /opt/irods/hooks
              readOnly: true
            - name: icat-dmfs
              mountPath: /opt/irods/DMFS
              readOnly: true
            - name: icat-bootstrap
              mountPath: /opt/irods/users.json
              subPath: users.json
            # SSL staging dir (files picked by name via ENV_IRODS_SSL_* )
            - name: icat-tls
              mountPath: /opt/irods_ssl_staging
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: icat-bootstrap
          configMap:
            name: icat-bootstrap
            defaultMode: 0755
        - name: icat-hooks
          configMap:
            name: icat-hooks
            defaultMode: 0755
        - name: icat-dmfs
          configMap:
            name: icat-dmfs
            defaultMode: 0755
        - name: icat-tls
          secret:
            secretName: icat-tls
            defaultMode: 0644
        - name: irods-ruleset-source
          configMap:
            name: irods-ruleset-source
            defaultMode: 0444
        - name: rules
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: vault
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-rwo
        resources:
          requests:
            storage: 5Gi
