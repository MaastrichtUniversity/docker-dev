# Headless Service for iCAT (StatefulSet stable identity + full iRODS port range).
# iRODS clients (all namespaces) use icat.irods.svc.cluster.local (k8s/dh-local-worklist.md).
apiVersion: v1
kind: Service
metadata:
  name: icat
  namespace: irods
  labels:
    app.kubernetes.io/name: icat
    app.kubernetes.io/part-of: datahub
    app.kubernetes.io/component: irods
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: icat
  ports:
    - name: irods
      port: 1247
      targetPort: 1247
      protocol: TCP
    - name: irods-ctrl
      port: 1248
      targetPort: 1248
      protocol: TCP
    - name: irods-data
      port: 20000
      targetPort: 20000
      protocol: TCP
