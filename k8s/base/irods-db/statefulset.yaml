apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: irods-db
  labels:
    app.kubernetes.io/name: irods-db
    app.kubernetes.io/part-of: datahub
spec:
  serviceName: irods-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: irods-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: irods-db
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Official postgres image needs the data dir owned by the postgres user on a fresh PVC
      initContainers:
        - name: chown-data
          image: postgres:17.10-alpine
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          # Overlay rewrites this to the mirrored registry image
          image: postgres:17.10-alpine
          # Same command override as docker-compose-irods.yml
          command: ["postgres", "-c", "standard_conforming_strings=off"]
          env:
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - configMapRef:
                name: irods-db-env
            - secretRef:
                name: irods-db-credentials
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # create_icat_db.sh: only runs on first init (empty data dir)
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: irods-db-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-rwo
        resources:
          requests:
            storage: 20Gi
