# Headless Service (required for StatefulSet stable DNS).
# TODO(k8s-rename): irods-db.dh.local -> irods-db.<ns>.svc.cluster.local (k8s/dh-local-worklist.md B)
apiVersion: v1
kind: Service
metadata:
  name: irods-db
  labels:
    app.kubernetes.io/name: irods-db
    app.kubernetes.io/part-of: datahub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: irods-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
