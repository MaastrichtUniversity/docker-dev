# Headless Service (required for StatefulSet stable DNS).
# Clients (all namespaces) use irods-db.irods.svc.cluster.local (k8s/dh-local-worklist.md).
apiVersion: v1
kind: Service
metadata:
  name: irods-db
  namespace: irods
  labels:
    app.kubernetes.io/name: irods-db
    app.kubernetes.io/part-of: datahub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: irods-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
