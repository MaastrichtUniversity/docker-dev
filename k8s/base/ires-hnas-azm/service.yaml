# Headless Service for ires-hnas-azm (StatefulSet identity + full iRODS port range).
# iRODS clients (all namespaces) use ires-hnas-azm.irods.svc.cluster.local (k8s/dh-local-worklist.md).
apiVersion: v1
kind: Service
metadata:
  name: ires-hnas-azm
  namespace: irods
  labels:
    app.kubernetes.io/name: ires-hnas-azm
    app.kubernetes.io/part-of: datahub
    app.kubernetes.io/component: irods
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ires-hnas-azm
  ports:
    - name: irods
      port: 1247
      targetPort: 1247
      protocol: TCP
    - name: irods-control-plane
      port: 1248
      targetPort: 1248
      protocol: TCP
    - name: irods-data
      port: 20000
      targetPort: 20000
      protocol: TCP
