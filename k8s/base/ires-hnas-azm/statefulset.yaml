# iRODS resource server HNAS-AZM (replication resource replRescAZM02).
# Identical shape to ires-hnas-um except: no garage/S3 setup init container
# (S3 resources are only created on the UM side) and no direct-ingest mount.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ires-hnas-azm
  namespace: irods
  labels:
    app.kubernetes.io/name: ires-hnas-azm
    app.kubernetes.io/part-of: datahub
    datahub.dh/profile: full
    app.kubernetes.io/component: irods
spec:
  serviceName: ires-hnas-azm
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ires-hnas-azm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ires-hnas-azm
        app.kubernetes.io/part-of: datahub
        app.kubernetes.io/component: irods
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      hostname: ires-hnas-azm
      # compose had shm_size: 500mb (Docker default /dev/shm is 64Mi)
      subdomain: ires-hnas-azm
      securityContext:
        runAsNonRoot: false
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.tcp_keepalive_intvl
            value: "75"
          - name: net.ipv4.tcp_keepalive_probes
            value: "9"
          - name: net.ipv4.tcp_keepalive_time
            value: "600"
      initContainers:
        - name: wait-icat
          # same image as the main container (kustomize rewrites both)
          image: registry.prod.dh.unimaas.nl/docker-dev/ires-hnas:latest
          command:
            - bash
            - -c
            - |
              dockerize -wait tcp://${ENV_IRODS_ICAT_HOST:-icat.irods.svc.cluster.local}:1247 -timeout 3600s
          envFrom:
            - configMapRef:
                name: irods-common-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: ires
          # Overlay rewrites this to <registry>/docker-dev/ires-hnas:<tag>
          image: registry.prod.dh.unimaas.nl/docker-dev/ires-hnas:latest
          env:
            - name: HOSTNAME
              value: ires-hnas-azm.irods.svc.cluster.local
            - name: TZ
              value: Europe/Amsterdam
            - name: ENV_IRODS_PASSWORD_ADMIN
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASSWORD_ADMIN
            - name: IRODS_PASS
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASS
            - name: ENV_IRODS_KEY_SERVER_ZONE
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_SERVER_ZONE
            - name: ENV_IRODS_KEY_SERVER_NEGOTIATION
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_SERVER_NEGOTIATION
            - name: ENV_IRODS_KEY_CONTROL_PLANE
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_KEY_CONTROL_PLANE
            - name: ENV_IRODS_PASSWORDS_SALT
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_PASSWORDS_SALT
            - name: ENV_IRODS_DB_IRODS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icat-app-secrets
                  key: IRODS_DB_IRODS_PASSWORD
            - name: ENV_S3_ACCESS_KEY_AC
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_ACCESS_KEY_AC
            - name: ENV_S3_SECRET_KEY_AC
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_SECRET_KEY_AC
            - name: ENV_S3_ACCESS_KEY_GL
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_ACCESS_KEY_GL
            - name: ENV_S3_SECRET_KEY_GL
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_SECRET_KEY_GL
          envFrom:
            - configMapRef:
                name: irods-common-env
            - configMapRef:
                name: ires-azm-env
            - secretRef:
                name: dh-irods-secrets-cfg
          ports:
            - name: irods
              containerPort: 1247
              protocol: TCP
            - name: irods-ctrl
              containerPort: 1248
              protocol: TCP
            - name: irods-data
              containerPort: 20000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"] # rsyslogd binds :514
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["/dh_is_ready.sh"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/dh_is_ready.sh"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "su irods -c 'iadmin whoami'"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: vault
              mountPath: /var/lib/irods
            - name: vault
              mountPath: /var/run/irods_installed
              subPath: irods_installed
            - name: vault
              mountPath: /var/log/irods-pre-ingest
              subPath: irods-pre-ingest
            - name: mnt
              mountPath: /mnt
            - name: zones
              mountPath: /mnt/ingest/zones
            - name: ires-azm-bootstrap
              mountPath: /opt/irods/bootstrap.sh
              subPath: bootstrap.sh
            - name: ires-azm-hooks
              mountPath: /opt/irods/hooks
              readOnly: true
            - name: ires-azm-tls
              mountPath: /opt/irods_ssl_staging
              readOnly: true
            - name: irods-secrets-cfg
              mountPath: /etc/secrets
              subPath: irods.secrets.cfg
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: ires-azm-bootstrap
          configMap:
            name: ires-azm-bootstrap
            defaultMode: 0755
        - name: ires-azm-hooks
          configMap:
            name: ires-azm-hooks
            defaultMode: 0755
        - name: ires-azm-tls
          secret:
            secretName: ires-azm-tls
            defaultMode: 0644
        - name: irods-secrets-cfg
          secret:
            secretName: dh-irods-secrets-cfg
            defaultMode: 0644
        - name: zones
          persistentVolumeClaim:
            claimName: staging-zones
  volumeClaimTemplates:
    - metadata:
        name: vault
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-rwo
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: mnt
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-rwo
        resources:
          requests:
            storage: 5Gi
