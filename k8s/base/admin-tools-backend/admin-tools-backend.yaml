apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-tools-backend
  namespace: internal
  labels:
    app.kubernetes.io/name: admin-tools-backend
    app.kubernetes.io/part-of: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-tools-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-tools-backend
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-tools-backend
          # Overlay rewrites this to <registry>/docker-dev/admin-tools-backend:<tag>
          image: registry.prod.dh.unimaas.nl/docker-dev/admin-tools-backend:latest
          env:
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - configMapRef:
                name: admin-tools-backend-env
            - secretRef:
                name: dh-secrets
            - secretRef:
                name: dh-irods-secrets-cfg
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin-tools-backend
  namespace: internal
  labels:
    app.kubernetes.io/name: admin-tools-backend
    app.kubernetes.io/part-of: datahub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-tools-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
