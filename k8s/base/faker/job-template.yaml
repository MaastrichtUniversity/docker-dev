# dh-faker job template (NOT part of the base kustomization - applied on demand
# by k8s/bin/faker.sh, which replaces __NAME__ and __ARGS__ first).
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: irods
  labels:
    app.kubernetes.io/name: dh-faker
    app.kubernetes.io/part-of: datahub
  annotations:
    datahub.dh/faker-args: "__ARGS__"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dh-faker
        app.kubernetes.io/part-of: datahub
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: faker
          # Overlay rewrites this to <registry>/docker-dev/faker:<tag>
          image: docker-dev/faker:latest
          command: ["python", "-u", "create_fake_data.py"]
          args: __ARGS__
          env:
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - configMapRef:
                name: faker-env
            - secretRef:
                name: dh-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: zones
              mountPath: /mnt/ingest/zones
      volumes:
        - name: zones
          persistentVolumeClaim:
            claimName: staging-zones
