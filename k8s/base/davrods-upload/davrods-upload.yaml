# DavRODS WebDAV upload endpoint (was profile "full" only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davrods-upload
  namespace: external
  labels:
    app.kubernetes.io/name: davrods-upload
    app.kubernetes.io/part-of: datahub
    datahub.dh/profile: full
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: davrods-upload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: davrods-upload
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: davrods-upload
          # Overlay rewrites this to <registry>/docker-dev/davrods-upload:<tag>
          image: registry.prod.dh.unimaas.nl/docker-dev/davrods-upload:latest
          env:
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - configMapRef:
                name: davrods-upload-env
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: davrods-upload
  namespace: external
  labels:
    app.kubernetes.io/name: davrods-upload
    app.kubernetes.io/part-of: datahub
    datahub.dh/profile: full
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: davrods-upload
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
