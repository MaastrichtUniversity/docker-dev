apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: no `namespace:` here - each overlay sets it (dh-dev / dh-tst / ...).
# The Namespace object itself ships in each overlay.
resources:
  - longhorn/storageclasses.yaml
  - irods-db/service.yaml
  - irods-db/statefulset.yaml
  - icat/service.yaml
  - icat/statefulset.yaml
  - ires-hnas-um/service.yaml
  - ires-hnas-um/statefulset.yaml
  - ires-hnas-azm/service.yaml
  - ires-hnas-azm/statefulset.yaml
  - garage/pvcs.yaml
  - garage/deployments.yaml
  - garage/s3-tls.yaml
  - garage/services.yaml
  - ldap/ldap.yaml
  - keycloak/keycloak.yaml
  - mdr/mdr.yaml
  - mdr-db/mdr-db.yaml
  - admin-tools-db/admin-tools-db.yaml
  - elastic/elastic.yaml
  - epicpid/epicpid.yaml
  - sram-sync/sram-sync.yaml
  - davrods/davrods.yaml
  - davrods-upload/davrods-upload.yaml
  - help-center-backend/help-center-backend.yaml
  - admin-tools-backend/admin-tools-backend.yaml
  - frontends/frontends.yaml
  # Optional segmentation - add to an overlay once k3s runs with --network-policy:
  # - networkpolicies/deny-and-dns.yaml
  # - networkpolicies/irods-flows.yaml
  # - networkpolicies/app-flows.yaml

# Static config (identical across environments) -> ConfigMaps.
# Per-environment env files + credentials live in the overlays' generators.
configMapGenerator:
  - name: irods-db-init
    files:
      - ../../irods/irods-db/create_icat_db.sh
  - name: icat-bootstrap
    files:
      - bootstrap.sh=./irods/config/icat-bootstrap.sh
      - ../../irods/icat/dh_is_ready.sh
      - ../../keycloak/users.json
  - name: icat-dmfs
    files:
      - ../../irods/icat/DMFS/dmattr
      - ../../irods/icat/DMFS/dmget
      - ../../irods/icat/DMFS/dmput
  # Vendored hook copies (k8s/base/irods/config/hooks-*/): the ires
  # bootstrap_irods.sh derives the physical resource name from
  # ENV_IRODS_HOST_RESC_NAME instead of ${HOSTNAME%%.dh.local}Resource, and
  # the ires pre-hook no longer rewrites /etc/hosts (k8s pods reach each
  # other natively). Keep in sync with irods/{icat,ires-hnas}/hooks/
  # when those change.
  - name: icat-hooks
    files:
      - ./irods/config/hooks-icat/bootstrap_pre_hook.sh
      - ./irods/config/hooks-icat/bootstrap_irods.sh
      - ./irods/config/hooks-icat/bootstrap_post_hook.sh
  - name: ires-um-bootstrap
    files:
      - bootstrap.sh=./irods/config/ires-bootstrap.sh
  - name: ires-azm-bootstrap
    files:
      - bootstrap.sh=./irods/config/ires-bootstrap.sh
  - name: ires-um-hooks
    files:
      - ./irods/config/hooks-ires/bootstrap_pre_hook.sh
      - ./irods/config/hooks-ires/bootstrap_irods.sh
      - ./irods/config/hooks-ires/bootstrap_post_hook.sh
      - ./irods/config/hooks-ires/bootstrap_s3_ires.sh
  - name: ires-azm-hooks
    files:
      - ./irods/config/hooks-ires/bootstrap_pre_hook.sh
      - ./irods/config/hooks-ires/bootstrap_irods.sh
      - ./irods/config/hooks-ires/bootstrap_post_hook.sh
      - ./irods/config/hooks-ires/bootstrap_s3_ires.sh
  - name: garage-config
    files:
      - ../../irods/garage/garage1.toml
      - ../../irods/garage/garage2.toml
  - name: garage-bootstrap
    files:
      - ../../irods/garage/bootstrap.sh
  - name: nginx-garage1-conf
    files:
      - ../../irods/garage/nginx-garage1.conf
  - name: nginx-garage2-conf
    files:
      - ../../irods/garage/nginx-garage2.conf
  - name: ldap-ldif
    files:
      - ../../ldap/ldif_custom/01_eduMember.ldif
      - ../../ldap/ldif_custom/02_openLdapEduperson-201602DV.ldif
      - ../../ldap/ldif_custom/03_voperson.ldif
      - ../../ldap/ldif_custom/09_groupOfMembers.ldif
      - ../../ldap/ldif_custom/99_ldap-datahubmaastricht-nl.ldif
