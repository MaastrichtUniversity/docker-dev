# DavRODS WebDAV download endpoint (was profile "full" only).
# Port 80; $VIRTUAL_HOST/$IRODS_SERVER are sed'd into the vhost at container start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davrods
  labels:
    app.kubernetes.io/name: davrods
    app.kubernetes.io/part-of: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: davrods
  template:
    metadata:
      labels:
        app.kubernetes.io/name: davrods
        app.kubernetes.io/part-of: datahub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: davrods
          # Overlay rewrites this to <registry>/docker-dev/davrods:<tag>
          image: docker-dev/davrods:latest
          env:
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - configMapRef:
                name: davrods-env
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: davrods
  labels:
    app.kubernetes.io/name: davrods
    app.kubernetes.io/part-of: datahub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: davrods
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
