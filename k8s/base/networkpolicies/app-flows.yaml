    matchLabels:
      app.kubernetes.io/name: help-center-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: irods
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [icat, ires-hnas-um, ires-hnas-azm]
      ports: [{port: 8000, protocol: TCP}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mdr
