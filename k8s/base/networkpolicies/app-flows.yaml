# All React dev-server frontends: ingress from traefik only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-allow
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [help-center, dh-home, mdr-home, admin-tools]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports: [{port: 3000, protocol: TCP}]
