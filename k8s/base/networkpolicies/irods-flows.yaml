      ports:
        - {port: 3900, protocol: TCP}
        - {port: 3901, protocol: TCP}
        - {port: 3903, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage1-s3-tls
      ports: [{port: 3900, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ires-hnas-um
      ports:
