  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: gateway-tls
    creationPolicy: Owner
    # Ingress TLS secrets must be kubernetes.io/tls with tls.crt/tls.key
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls.crt }}"
        tls.key: "{{ .tls.key }}"
  data:
    - secretKey: tls.crt
      remoteRef: { key: tst-k3s/gateway-tls, property: tls.crt }
    - secretKey: tls.key
      remoteRef: { key: tst-k3s/gateway-tls, property: tls.key }
