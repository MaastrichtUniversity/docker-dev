# ExternalSecrets (operator: external-secrets.io/v1) for the tst environment.
#
# All 11 Secrets the base manifests reference are created/refreshed by the
# operator from Vault - one ExternalSecret per k8s Secret, one Vault path
# per Secret (k8s/README.md section 7). The operator creates the k8s
# Secrets with exactly the names the base manifests consume (envFrom /
# volume mounts). Do NOT also add a kustomize secretGenerator for the same
# name in this overlay (one backend per Secret per env).
#
# PLACEHOLDERS to fix when wiring up Vault:
#   - ClusterSecretStore `dh-vault`: server address, kubernetes auth role,
#     caBundle (if Vault uses a private CA)
#   - the remoteRef.key values below assume the suggested KV v2 layout
#     `secret/datahub/tst/<key>`, one Vault key per Secret key
#   - path `ingress-tls`: the multi-SAN tst cert (keys `tls.crt` =
#     fullchain, `tls.key` = private key) for the Ingress tls blocks in
#     ingress.yaml - only created in the namespaces whose Ingress has a
#     tls block (external/public/internal), as a kubernetes.io/tls Secret
#
# iRODS/garage TLS: the committed test material in irods/k8s-ssl-certs/
# carries SANs for *.irods.svc.cluster.local and is valid for every env
# (namespaces are the same across envs) - import those files under the
# *-tls paths below, or generate per-env certs with bin/gen-irods-tls.sh.
# prd: use real PKI material.
#
# The CA key name below must match ENV_IRODS_SSL_CA_CERTIFICATE in
# config/{icat,ires-um,ires-azm}.env (test_only_tst_irods_dh_ca_cert.pem).

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dh-vault
spec:
  provider:
    vault:
      # TODO(placeholder): Vault address
      server: "https://vault.dh.unimaas.nl"
      # KV v2 base path for this env; remoteRef keys are relative to it
      path: "secret/datahub/tst"
      version: "v2"
      # TODO(placeholder): add if Vault serves a private CA
      # caBundle: |
      #   ...
      auth:
        kubernetes:
          # The operator authenticates with its projected service-account
          # token; Vault verifies it via the kubernetes auth method.
          method: "jwt"
          # TODO(placeholder): kubernetes auth role, bound to the
          # external-secrets SA and the secret/datahub/tst/* paths
          role: "datahub-tst"
---
