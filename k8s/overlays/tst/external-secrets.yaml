apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-tls
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
    apiGroup: external-secrets.io
  target:
    name: ingress-tls
    creationPolicy: Owner
    # Ingress TLS secrets must be kubernetes.io/tls with tls.crt/tls.key
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls.crt }}"
        tls.key: "{{ .tls.key }}"
  data:
    - secretKey: tls.crt
      remoteRef: { key: ingress-tls, property: tls.crt }
    - secretKey: tls.key
      remoteRef: { key: ingress-tls, property: tls.key }
