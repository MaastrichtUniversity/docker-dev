apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: icat-tls
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: icat-tls
    creationPolicy: Owner
  data:
    # Secret KEYS keep the historical file names (ENV_IRODS_SSL_* reference
    # them); import irods/k8s-ssl-certs/{icat.crt,icat.key,dhparams.pem,
    # ca.pem} under the key names below.
    - secretKey: icat.dh.local.crt
      remoteRef: { key: tst-k3s/icat-tls, property: icat.dh.local.crt }
    - secretKey: icat.dh.local.key
      remoteRef: { key: tst-k3s/icat-tls, property: icat.dh.local.key }
    - secretKey: dhparams.pem
      remoteRef: { key: tst-k3s/icat-tls, property: dhparams.pem }
    - secretKey: test_only_tst_irods_dh_ca_cert.pem
      remoteRef:
        { key: tst-k3s/icat-tls, property: test_only_tst_irods_dh_ca_cert.pem }
---
