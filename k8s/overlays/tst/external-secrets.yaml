# ExternalSecrets (operator: external-secrets.io/v1) for the tst environment.
#
# All Secrets the base manifests reference are created/refreshed by the
# operator from Vault - one ExternalSecret per k8s Secret. Application
# credentials are split into least-privilege target Secrets (see README
# section 7); the Vault paths are placeholders to provision per environment.
# The operator creates the k8s
# Secrets with exactly the names the base manifests consume (envFrom /
# volume mounts). Do NOT also add a kustomize secretGenerator for the same
# name in this overlay (one backend per Secret per env).
#
# PLACEHOLDERS to fix when wiring up Vault:
#   - ClusterSecretStore `dh-vault`: server address, kubernetes auth role,
#     caBundle (if Vault uses a private CA)
#   - the remoteRef.key values below use the KV v2 layout
#     `tst/data/tst-k3s/<key>`, one Vault secret path per k8s Secret
#   - path `gateway-tls`: the multi-SAN tst cert (keys `tls.crt` =
#     fullchain, `tls.key` = private key) for the Gateway https listeners
#     in gateway.yaml - only created in the namespaces that have
#     TLS-terminating Gateways (external/public/internal), as a
#     kubernetes.io/tls Secret (certificateRefs)
#
# Central Kubernetes-auth service account (`vault-auth` in namespace
# `external-secrets`, TokenReview RBAC) lives in vault-auth.yaml.
#
# iRODS/garage TLS: the committed test material in irods/k8s-ssl-certs/
# carries SANs for *.irods.svc.cluster.local and is valid for every env
# (namespaces are the same across envs) - import those files under the
# *-tls paths below, or generate per-env certs with bin/gen-irods-tls.sh.
# prd: use real PKI material.
#
# The CA key name below must match ENV_IRODS_SSL_CA_CERTIFICATE in
# config/{icat,ires-um,ires-azm}.env (test_only_tst_irods_dh_ca_cert.pem).

# ============ namespace: irods ============
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: icat-app-secrets
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: icat-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: IRODS_PASSWORD_ADMIN
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_PASSWORD_ADMIN }
    - secretKey: IRODS_PASS
      remoteRef: { key: tst-k3s/icat-app-secrets, property: IRODS_PASS }
    - secretKey: IRODS_KEY_SERVER_ZONE
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_KEY_SERVER_ZONE }
    - secretKey: IRODS_KEY_SERVER_NEGOTIATION
      remoteRef:
        {
          key: tst-k3s/icat-app-secrets,
          property: IRODS_KEY_SERVER_NEGOTIATION,
        }
    - secretKey: IRODS_KEY_CONTROL_PLANE
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_KEY_CONTROL_PLANE }
    - secretKey: IRODS_PASSWORDS_SALT
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_PASSWORDS_SALT }
    - secretKey: IRODS_DB_IRODS_PASSWORD
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_DB_IRODS_PASSWORD }
    - secretKey: IRODS_DB_POSTGRES_PASSWORD
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_DB_POSTGRES_PASSWORD }
---
