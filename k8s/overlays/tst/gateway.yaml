# Traefik Gateway API routes for the tst environment (replaces the
# docker-common nginx-virtual-proxy + VIRTUAL_HOST labels). The cluster
# uses Gateway API, not Ingress: one Gateway + one HTTPRoute per public
# host (gatewayClassName traefik).
#
# Listeners: hosts covered by the multi-SAN tst cert get both an https
# (443, Terminate) and an http (80) listener, so both schemes work. Hosts
# NOT in the cert are HTTP-only until it is re-issued with them:
# epicpid.tst, helpbackend.tst, admintoolsbackend.tst.
#
# Public host names follow the cert's SANs (the published tst names): the
# MDR app is `app.mdr.tst...` and the elastic UI `elk.tst...`.
#
# TLS: certificateRefs point at the `gateway-tls` Secret
# (kubernetes.io/tls), created by the ExternalSecret of the same name in
# each of these namespaces (external-secrets.yaml, Vault path
# `gateway-tls`: tls.crt/tls.key).
#
# Follow-up: once the public hosts are reached over https, flip the
# app-level URLs in config/*.env (DATAHUB_HOME_URL, SAML_DJANGO_BASE_URL,
# WEBDAV_*_URL, ...) from http:// to https:// to avoid mixed content.

# ============ external: app.mdr.tst (MDR app) ============
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-mdr-gateway
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: app.mdr.tst.dh.unimaas.nl
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
    - name: http
      port: 80
      protocol: HTTP
      hostname: app.mdr.tst.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-mdr-route
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  parentRefs:
    - name: app-mdr-gateway
  hostnames:
    - app.mdr.tst.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mdr
          port: 8000
---
