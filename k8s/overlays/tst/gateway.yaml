        - path:
            type: PathPrefix
            value: /help_backend
      backendRefs:
        - name: help-center-backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: help-center
          port: 3000
---
