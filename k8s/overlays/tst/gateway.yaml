# ============ public: help.mdr.tst (help-center + /help_backend API) ============
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: help-gateway
  namespace: public
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: help.mdr.tst.dh.unimaas.nl
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
    - name: http
      port: 80
      protocol: HTTP
      hostname: help.mdr.tst.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: help-route
  namespace: public
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  parentRefs:
    - name: help-gateway
  hostnames:
    - help.mdr.tst.dh.unimaas.nl
  rules:
    # /help_backend routes already carry the prefix in the FastAPI paths,
    # so no path rewrite is needed.
