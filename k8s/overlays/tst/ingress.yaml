# Traefik ingress for the tst environment (replaces the docker-common
# nginx-virtual-proxy + VIRTUAL_HOST labels). One Ingress per namespace:
# the k8s Ingress API can only route to Services in its own namespace, and
# all hosts of a group live in one namespace.
#
# TLS: the Ingresses that carry a `tls:` block are served on both web
# (80) and websecure (443) - the cert is the multi-SAN tst cert for
# *.tst.dh.unimaas.nl, stored in Vault (path `ingress-tls`) and created in
# each Ingress namespace by the ExternalSecret `ingress-tls`
# (external-secrets.yaml; an Ingress TLS secret must live in the same
# namespace as the Ingress).
#
# Public host names follow the cert's SANs (which define the published
# tst names): the MDR app is `app.mdr.tst...` and the elastic UI
# `elk.tst...` - not the dev-derived `app.tst`/`elastic.tst`.
#
# Hosts NOT in the cert (HTTP-only until it is re-issued with them):
# epicpid.tst, helpbackend.tst, auth.tst, admintoolsbackend.tst.
#
# Follow-up: once the public hosts are reached over https, flip the
# app-level URLs in config/*.env (DATAHUB_HOME_URL, SAML_DJANGO_BASE_URL,
# WEBDAV_*_URL, ...) from http:// to https:// to avoid mixed content.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-external
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mdr.tst.dh.unimaas.nl
        - app.mdr.tst.dh.unimaas.nl
        - download.tst.dh.unimaas.nl
        - upload.tst.dh.unimaas.nl
        - elk.tst.dh.unimaas.nl
      secretName: ingress-tls
  rules:
    - host: app.mdr.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mdr
                port:
                  number: 8000
    - host: elk.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elastic
                port:
                  number: 9200
    - host: download.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: davrods
                port:
                  number: 80
    - host: upload.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: davrods-upload
                port:
                  number: 80
    - host: mdr.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mdr-home
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-irods
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  ingressClassName: traefik
  rules:
    - host: epicpid.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epicpid
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-public
  namespace: public
  labels:
    app.kubernetes.io/part-of: datahub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - help.mdr.tst.dh.unimaas.nl
        - tst.dh.unimaas.nl
      secretName: ingress-tls
  rules:
    - host: helpbackend.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: help-center-backend
                port:
                  number: 8000
    # /help_backend routes already carry the prefix in the FastAPI paths,
    # so no path rewrite is needed.
    - host: help.mdr.tst.dh.unimaas.nl
      http:
        paths:
          - path: /help_backend
            pathType: Prefix
            backend:
              service:
                name: help-center-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: help-center
                port:
                  number: 3000
    - host: tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dh-home
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-internal
  namespace: internal
  labels:
    app.kubernetes.io/part-of: datahub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.tst.dh.unimaas.nl
        - admin.tst.dh.unimaas.nl
      secretName: ingress-tls
  rules:
    - host: keycloak.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    # OIDC/SAML alias used by admin-tools-backend (OIDC_DOMAIN)
    - host: auth.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    # /api keeps its prefix in the FastAPI routes, so no rewrite is needed.
    - host: admin.tst.dh.unimaas.nl
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-tools-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-tools
                port:
                  number: 3000
    - host: admintoolsbackend.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-tools-backend
                port:
                  number: 8000
