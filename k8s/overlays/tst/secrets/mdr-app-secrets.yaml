apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mdr-app-secrets
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: mdr-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: MDR_POSTGRES_PASSWORD
      remoteRef:
        { key: tst-k3s/mdr-app-secrets, property: MDR_POSTGRES_PASSWORD }
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: { key: tst-k3s/mdr-app-secrets, property: DJANGO_SECRET_KEY }
    - secretKey: IRODS_PASS
      remoteRef: { key: tst-k3s/icat-app-secrets, property: IRODS_PASS }
    - secretKey: DATAVERSE_TOKEN
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: DATAVERSE_TOKEN }
    - secretKey: BIOPORTAL_API_KEY
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: BIOPORTAL_API_KEY }
    - secretKey: ATLASSIAN_API_USERNAME
      remoteRef:
        { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_USERNAME }
    - secretKey: ATLASSIAN_API_KEY
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_KEY }
