apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dh-irods-secrets-cfg
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: dh-irods-secrets-cfg
    creationPolicy: Owner
  data:
    - secretKey: INGEST_PASSWORD
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: INGEST_PASSWORD }
    - secretKey: INGEST_USER
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: INGEST_USER }
    - secretKey: INGEST_MOUNT
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: INGEST_MOUNT }
    - secretKey: LDAP_PASSWORD
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: LDAP_PASSWORD }
    - secretKey: LDAP_USER
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: LDAP_USER }
    - secretKey: LDAP_URL
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: LDAP_URL }
    - secretKey: LDAP_DOMAIN
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: LDAP_DOMAIN }
    - secretKey: USE_SAMBA
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: USE_SAMBA }
    - secretKey: DATAVERSE_TOKEN
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: DATAVERSE_TOKEN }
    - secretKey: BIOPORTAL_API_KEY
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: BIOPORTAL_API_KEY }
    - secretKey: ATLASSIAN_API_USERNAME
      remoteRef:
        { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_USERNAME }
    - secretKey: ATLASSIAN_API_KEY
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_KEY }
    - secretKey: REACT_APP_CAPTCHA_SECRET_KEY
      remoteRef:
        {
          key: tst-k3s/irods-secrets-cfg,
          property: REACT_APP_CAPTCHA_SECRET_KEY,
        }
    - secretKey: REACT_APP_CAPTCHA_SITE_KEY
      remoteRef:
        { key: tst-k3s/irods-secrets-cfg, property: REACT_APP_CAPTCHA_SITE_KEY }
    # raw file mounted at /etc/secrets (same content as the env keys above,
    # in irods.secrets.cfg format)
    - secretKey: irods.secrets.cfg
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: irods.secrets.cfg }
