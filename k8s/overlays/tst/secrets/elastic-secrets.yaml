apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-secrets
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: elastic-secrets
    creationPolicy: Owner
  data:
    - secretKey: ELASTIC_PASSWORD
      remoteRef: { key: tst-k3s/elastic-secrets, property: ELASTIC_PASSWORD }
