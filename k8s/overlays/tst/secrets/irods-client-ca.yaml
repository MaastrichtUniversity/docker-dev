# CA that signed the k8s iRODS server certs (gen-irods-tls.sh, same material
# as the icat-tls secret in the irods ns) materialized for *client* workloads
# living in other namespaces: k8s secrets can't be mounted cross-namespace.
# The client images only bake in the compose dev CA, so the pods add this CA
# to their trust store at startup (see patches/*-irods-ca.yaml).
# irods-ns clients (sram-sync, epicpid) mount the existing icat-tls secret
# directly; no ExternalSecret needed there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: irods-client-ca
  namespace: internal
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: irods-client-ca
    creationPolicy: Owner
  data:
    - secretKey: test_only_tst_irods_dh_ca_cert.pem
      remoteRef:
        { key: tst-k3s/icat-tls, property: test_only_tst_irods_dh_ca_cert.pem }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: irods-client-ca
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: irods-client-ca
    creationPolicy: Owner
  data:
    - secretKey: test_only_tst_irods_dh_ca_cert.pem
      remoteRef:
        { key: tst-k3s/icat-tls, property: test_only_tst_irods_dh_ca_cert.pem }
