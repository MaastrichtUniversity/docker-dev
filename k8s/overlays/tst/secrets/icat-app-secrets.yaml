# ExternalSecret for iCAT & iRODS database/server credentials.
# Vault KV v2 path: tst/data/tst-k3s/icat-app-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: icat-app-secrets
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: icat-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: IRODS_PASSWORD_ADMIN
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_PASSWORD_ADMIN }
    - secretKey: IRODS_PASS
      remoteRef: { key: tst-k3s/icat-app-secrets, property: IRODS_PASS }
    - secretKey: IRODS_KEY_SERVER_ZONE
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_KEY_SERVER_ZONE }
    - secretKey: IRODS_KEY_SERVER_NEGOTIATION
      remoteRef:
        {
          key: tst-k3s/icat-app-secrets,
          property: IRODS_KEY_SERVER_NEGOTIATION,
        }
    - secretKey: IRODS_KEY_CONTROL_PLANE
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_KEY_CONTROL_PLANE }
    - secretKey: IRODS_PASSWORDS_SALT
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_PASSWORDS_SALT }
    - secretKey: IRODS_DB_IRODS_PASSWORD
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_DB_IRODS_PASSWORD }
    - secretKey: IRODS_DB_POSTGRES_PASSWORD
      remoteRef:
        { key: tst-k3s/icat-app-secrets, property: IRODS_DB_POSTGRES_PASSWORD }
