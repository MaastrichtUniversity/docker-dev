# The CA key name below must match ENV_IRODS_SSL_CA_CERTIFICATE in
# config/ires-um.env (test_only_tst_irods_dh_ca_cert.pem).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ires-um-tls
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: ires-um-tls
    creationPolicy: Owner
  data:
    - secretKey: ires-hnas-um.dh.local.crt
      remoteRef:
        { key: tst-k3s/ires-um-tls, property: ires-hnas-um.dh.local.crt }
    - secretKey: ires-hnas-um.dh.local.key
      remoteRef:
        { key: tst-k3s/ires-um-tls, property: ires-hnas-um.dh.local.key }
    - secretKey: dhparams.pem
      remoteRef: { key: tst-k3s/ires-um-tls, property: dhparams.pem }
    - secretKey: test_only_tst_irods_dh_ca_cert.pem
      remoteRef:
        {
          key: tst-k3s/ires-um-tls,
          property: test_only_tst_irods_dh_ca_cert.pem,
        }
