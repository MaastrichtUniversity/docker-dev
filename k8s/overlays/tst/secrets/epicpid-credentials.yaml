apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epicpid-credentials
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: epicpid-credentials
    creationPolicy: Owner
  data:
    # SURF handle-server client credentials (committed in the
    # epicpid-microservice repo; import their contents into Vault)
    - secretKey: 305_21_T12996_USER01_UM_privkey.pem
      remoteRef:
        { key: tst-k3s/epicpid, property: privkey.pem }
    - secretKey: 305_21_T12996_USER01_UM_certificate_only.pem
      remoteRef:
        { key: tst-k3s/epicpid, property: certificate_only.pem }
