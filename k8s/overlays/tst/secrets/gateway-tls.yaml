# Multi-SAN TLS certificate (`gateway-tls`) materialized into each namespace
# that hosts TLS-terminating Gateways (external, public, internal).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-tls
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: gateway-tls
    creationPolicy: Owner
    # Ingress TLS secrets must be kubernetes.io/tls with tls.crt/tls.key
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_crt }}"
        tls.key: "{{ .tls_key }}"
  data:
    - secretKey: tls_crt
      remoteRef: { key: tst-k3s/gateway-tls, property: tls_crt }
    - secretKey: tls_key
      remoteRef: { key: tst-k3s/gateway-tls, property: tls_key }
---
