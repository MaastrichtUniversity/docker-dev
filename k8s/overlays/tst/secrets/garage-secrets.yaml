apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_RPC_SECRET
      remoteRef: { key: tst-k3s/garage-secrets, property: GARAGE_RPC_SECRET }
    - secretKey: GARAGE_ADMIN_TOKEN
      remoteRef: { key: tst-k3s/garage-secrets, property: GARAGE_ADMIN_TOKEN }
    - secretKey: S3_ACCESS_KEY_AC
      remoteRef: { key: tst-k3s/garage-secrets, property: S3_ACCESS_KEY_AC }
    - secretKey: S3_SECRET_KEY_AC
      remoteRef: { key: tst-k3s/garage-secrets, property: S3_SECRET_KEY_AC }
    - secretKey: S3_ACCESS_KEY_GL
      remoteRef: { key: tst-k3s/garage-secrets, property: S3_ACCESS_KEY_GL }
    - secretKey: S3_SECRET_KEY_GL
      remoteRef: { key: tst-k3s/garage-secrets, property: S3_SECRET_KEY_GL }
