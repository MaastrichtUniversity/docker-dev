apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epicpid-app-secrets
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: epicpid-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: PASSWORD
      remoteRef: { key: tst-k3s/epicpid-app-secrets, property: PASSWORD }
