apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ldap-secrets
  namespace: internal
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: ldap-secrets
    creationPolicy: Owner
  data:
    - secretKey: LDAP_ADMIN_PASSWORD
      remoteRef: { key: tst-k3s/ldap-secrets, property: LDAP_ADMIN_PASSWORD }
