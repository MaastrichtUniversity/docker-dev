apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-tools-secrets
  namespace: internal
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: admin-tools-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: tst-k3s/admin-tools-secrets, property: DB_PASSWORD }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        { key: tst-k3s/admin-tools-secrets, property: OIDC_CLIENT_SECRET }
    - secretKey: SECRET_KEY
      remoteRef: { key: tst-k3s/admin-tools-secrets, property: SECRET_KEY }
    - secretKey: AIRFLOW_API_KEY
      remoteRef: { key: tst-k3s/admin-tools-secrets, property: AIRFLOW_API_KEY }
    - secretKey: IRODS_PASS
      remoteRef: { key: tst-k3s/icat-app-secrets, property: IRODS_PASS }
    - secretKey: ATLASSIAN_API_USERNAME
      remoteRef:
        { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_USERNAME }
    - secretKey: ATLASSIAN_API_KEY
      remoteRef: { key: tst-k3s/irods-secrets-cfg, property: ATLASSIAN_API_KEY }
