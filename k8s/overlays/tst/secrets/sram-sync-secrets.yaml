apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sram-sync-secrets
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: sram-sync-secrets
    creationPolicy: Owner
  data:
    - secretKey: LDAP_PASS
      remoteRef: { key: tst-k3s/sram-sync-secrets, property: LDAP_PASS }
