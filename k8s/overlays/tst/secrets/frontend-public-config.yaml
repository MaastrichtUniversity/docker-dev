apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-public-config
  namespace: public
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: frontend-public-config
    creationPolicy: Owner
  data:
    - secretKey: REACT_APP_CAPTCHA_SITE_KEY
      remoteRef:
        { key: tst-k3s/irods-secrets-cfg, property: REACT_APP_CAPTCHA_SITE_KEY }
