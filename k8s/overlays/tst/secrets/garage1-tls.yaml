apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage1-tls
  namespace: irods
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: dh-vault
    kind: ClusterSecretStore
  target:
    name: garage1-tls
    creationPolicy: Owner
  data:
    - secretKey: garage1.dh.local.crt
      remoteRef: { key: tst-k3s/garage1-tls, property: garage1.dh.local.crt }
    - secretKey: garage1.dh.local.key
      remoteRef: { key: tst-k3s/garage1-tls, property: garage1.dh.local.key }
