# Cluster-wide registry pull secret materialized into every DataHub workload
# namespace (irods, external, public, internal).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: registry-credentials
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  externalSecretName: registry-credentials
  refreshTime: 5m
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - irods
            - external
            - public
            - internal
  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: dh-vault
      kind: ClusterSecretStore
    target:
      name: registry-credentials
      creationPolicy: Owner
      template:
        engineVersion: v2
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .dockerconfigjson }}"
    dataFrom:
      - extract:
          key: tst-k3s/registry-credentials
