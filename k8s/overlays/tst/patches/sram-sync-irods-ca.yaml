# sram-sync (python-irodsclient) trusts only the compose dev CA baked into
# its image. Same fix as admin-tools-backend/mdr: mount the k8s iRODS CA
# (this pod is in the irods ns, so the existing icat-tls secret works) and
# add it to the system trust store before startup.
# The image's bootstrap.sh is `exec python3 -u "$@"` (no default script), so
# run the script explicitly with the compose args (compose: `command:
# sram-sync.py --commit --scheduled`) - without them the container just
# exits 0 and crashloops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sram-sync
  namespace: irods
spec:
  template:
    spec:
      containers:
        - name: sram-sync
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /opt/irods-ca/test_only_tst_irods_dh_ca_cert.pem \
                 /usr/local/share/ca-certificates/irods-k8s-ca.crt
              update-ca-certificates
              exec python3 -u sram-sync.py --commit --scheduled
          volumeMounts:
            - name: irods-ca
              mountPath: /opt/irods-ca
              readOnly: true
      volumes:
        - name: irods-ca
          secret:
            secretName: icat-tls
