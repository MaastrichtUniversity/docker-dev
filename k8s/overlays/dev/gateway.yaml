# Traefik Gateway API routes for the dev environment (replaces the
# docker-common nginx-virtual-proxy + VIRTUAL_HOST labels). The cluster
# uses Gateway API, not Ingress: one Gateway + one HTTPRoute per public
# host (gatewayClassName traefik).
#
# Dev is HTTP-only (as the compose stack was) - http listeners only. For
# acc/prd add https listeners with tls: (mode Terminate +
# certificateRefs) like overlays/tst/gateway.yaml does.
#
# Host names follow the dev public naming: the MDR app is
# `app.mdr.dev...` (the app-level URLs point there), the elastic UI
# `elastic.dev...` (compose VIRTUAL_HOST).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-mdr-gateway
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: app.mdr.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-mdr-route
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  parentRefs:
    - name: app-mdr-gateway
  hostnames:
    - app.mdr.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mdr
          port: 8000
---
