# Traefik ingress for the dev environment (replaces the docker-common
# nginx-virtual-proxy + VIRTUAL_HOST labels). One Ingress per namespace:
# the k8s Ingress API can only route to Services in its own namespace, and
# all hosts of a group live in one namespace.
#
# Dev is HTTP-only (as the compose stack was). For acc/prd add per-Ingress
# `tls:` blocks (hosts + a secret created in the Ingress' namespace by
# bin/gen-ingress-tls.sh) and the
# traefik.ingress.kubernetes.io/router.entrypoints=web,websecure annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-external
  namespace: external
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  ingressClassName: traefik
  rules:
    - host: app.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mdr
                port:
                  number: 8000
    - host: elastic.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elastic
                port:
                  number: 9200
    - host: download.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: davrods
                port:
                  number: 80
    - host: upload.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: davrods-upload
                port:
                  number: 80
    - host: mdr.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mdr-home
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
