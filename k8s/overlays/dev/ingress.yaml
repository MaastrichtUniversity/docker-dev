    - host: epicpid.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epicpid
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-public
  namespace: public
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  ingressClassName: traefik
  rules:
    - host: helpbackend.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: help-center-backend
                port:
                  number: 8000
    # /help_backend routes already carry the prefix in the FastAPI paths,
    # so no path rewrite is needed.
    - host: help.mdr.dev.dh.unimaas.nl
      http:
        paths:
          - path: /help_backend
            pathType: Prefix
            backend:
              service:
                name: help-center-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: help-center
                port:
                  number: 3000
    - host: dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dh-home
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datahub-internal
  namespace: internal
  labels:
    app.kubernetes.io/part-of: datahub
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    # OIDC/SAML alias used by admin-tools-backend (OIDC_DOMAIN)
    - host: auth.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    # /api keeps its prefix in the FastAPI routes, so no rewrite is needed.
    - host: admin.dev.dh.unimaas.nl
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-tools-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-tools
                port:
                  number: 3000
    - host: admintoolsbackend.dev.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-tools-backend
                port:
                  number: 8000
