            storage: 5Gi
    - metadata:
        name: mnt
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: irods-db
  namespace: irods
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
