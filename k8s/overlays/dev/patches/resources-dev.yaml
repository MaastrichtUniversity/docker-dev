# dev/minikube: reduced CPU/memory requests+limits (dev is for validation
# and feature development, not load). Sum of all pod requests drops from
# ~6.8 CPU / 12Gi to ~2.5 CPU / 6.2Gi - fits a 4 CPU / 8Gi minikube.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: icat
  namespace: irods
spec:
  template:
    spec:
      containers:
        - name: icat
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
---
