# dev/minikube image patches: keep the registry.prod.dh.unimaas.nl/docker-dev/*:latest
# names/tags (so locally built images can be pushed when needed), strip
# imagePullSecrets, and set imagePullPolicy: Never across all containers and
# initContainers so minikube uses the locally built and pre-pulled images.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: icat
  namespace: irods
spec:
  selector: {}
  template:
    spec:
      imagePullSecrets:
        - $patch: delete
      initContainers:
        - name: wait-db
          imagePullPolicy: Never
      containers:
        - name: icat
          imagePullPolicy: Never
---
